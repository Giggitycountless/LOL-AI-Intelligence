     1|[workspace]
     2|members = [
     3|  "src-tauri",
     4|  "crates/adapters",
     5|  "crates/application",
     6|  "crates/domain",
     7|  "crates/platform",
     8|  "crates/storage",
     9|]
    10|resolver = "2"
    11|
    12|[workspace.package]
    13|version = "0.1.0"
edition = "2024"
    15|license = "UNLICENSED"
    16|
    17|[workspace.dependencies]
    18|adapters = { path = "crates/adapters" }
    19|application = { path = "crates/application" }
    20|domain = { path = "crates/domain" }
    21|platform = { path = "crates/platform" }
    22|storage = { path = "crates/storage" }
    23|
    24|rusqlite = { version = "0.39.0", features = ["bundled"] }
    25|reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
    26|serde = { version = "1.0.228", features = ["derive"] }
    27|serde_json = "1.0.149"
    28|sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
    29|tauri = "2.10.3"
    30|tauri-build = "2.5.6"
    31|tauri-plugin-global-shortcut = "2.3.1"
    32|rayon = "1.10"
    33|futures-util = "0.3.31"
    34|native-tls = "0.2.14"
    35|tokio = { version = "1.48.0", features = ["net", "rt-multi-thread", "time"] }
    36|tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
    37|tokio-util = "0.7.18"
    38|percent-encoding = "2.3"
    39|
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
