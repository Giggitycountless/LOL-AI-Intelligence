[workspace]
members = [
  "src-tauri",
  "crates/adapters",
  "crates/application",
  "crates/domain",
  "crates/platform",
  "crates/storage",
]
resolver = "2"

[workspace.package]
version = "0.3.8"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
adapters = { path = "crates/adapters" }
application = { path = "crates/application" }
domain = { path = "crates/domain" }
platform = { path = "crates/platform" }
storage = { path = "crates/storage" }

rusqlite = { version = "0.39.0", features = ["bundled"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tauri = "2.10.3"
tauri-build = "2.5.6"
rdev = "0.5"
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }
rayon = "1.10"
futures-util = "0.3.31"
native-tls = "0.2.14"
tokio = { version = "1.48.0", features = ["net", "rt-multi-thread", "time", "macros"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
tokio-util = "0.7.18"
percent-encoding = "2.3"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true

# reqwest's blocking client has a debug-assertions-only sanity check (`wait::enter`)
# that builds and drops a throwaway Tokio runtime solely to panic if a blocking
# request runs inside an async context. This app intentionally drives the blocking
# LCU client from async contexts (the auto-accept monitor and Tauri command
# dispatch); that is harmless in release (the check compiles out) but panics in
# `npm run dev` with "Cannot drop a runtime in a context where blocking is not
# allowed". Compile reqwest without debug-assertions so dev matches release. Our
# own crates keep their debug-assertions.
[profile.dev.package.reqwest]
debug-assertions = false

[profile.test.package.reqwest]
debug-assertions = false
