name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LoL Desktop Assistant ${{ github.ref_name }}"
          releaseBody: "Installer built automatically by CI. Release notes to follow."
          releaseDraft: true
          prerelease: false

      - name: Upload checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installers = Get-ChildItem -Path "target/release/bundle/nsis" -Filter *.exe
          foreach ($installer in $installers) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $installer.FullName
            $line = "$($hash.Hash.ToLower())  $($installer.Name)"
            $checksumPath = "$($installer.FullName).sha256"
            Set-Content -Path $checksumPath -Value $line -Encoding ascii -NoNewline
            Write-Output $line
            gh release upload "${{ github.ref_name }}" $checksumPath --clobber
          }
